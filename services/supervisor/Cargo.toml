[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid.workspace = true
bincode-next.workspace = true
ron.workspace = true
serde.workspace = true
sha2.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }
rustix = { version = "1", features = ["event", "net", "pipe", "process", "time"] }
files_manager = { version = "0.1.0", path = "../../libraries/files_manager" }
executables_manager = { version = "0.1.0", path = "../../libraries/executables_manager" }
ws_manager = { version = "0.1.0", path = "../../libraries/ws_manager" }
